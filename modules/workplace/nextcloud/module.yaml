schema: 1

id: workplace/nextcloud
name: Nextcloud
description: File collaboration and storage platform.

stateful: true

requires:
  - core/network
  - core/traefik
  - data/postgres
  - data/valkey

provides:
  - files

secrets:
  - nextcloud-db-password
  - nextcloud-admin-password

networks:
  - edge
  - data

storage:
  - id: data
    backup: true

images:
  - id: nextcloud
    version: 34.0.3-apache
    reference: docker.io/library/nextcloud@sha256:8e5f49801db0cf4659b3089ce1917728023bb8cba7f93731f2abbdfe3a18df0a
